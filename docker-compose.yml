services:
  auth:
    build: .
    restart: unless-stopped
    env_file: .env
    # 签名密钥（含私钥）不进镜像，运行时只读挂载
    # 首次部署前：mkdir -p keys && docker compose run --rm auth node scripts/gen-keys.mjs
    volumes:
      - ./keys:/app/keys:ro
    # 生产只允许本机反代访问，不对外暴露
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/api/config || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - auth
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
