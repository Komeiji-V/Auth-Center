<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f6f8; color: #222; min-height: 100vh; }
  .wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    align-items: flex-start;
    max-width: 980px;
    margin: 32px auto;
    padding: 0 16px;
  }
  .card {
    background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); padding: 24px;
    flex: 0 1 calc(50% - 8px);
    min-width: 0;
  }
  #loginNeeded { display: none; flex: 0 1 100%; max-width: 420px; margin: 0 auto; text-align: center; padding: 60px 24px; }
  .session-row { padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .session-row:last-child { border-bottom: 0; }
  .muted { color: #888; font-size: 12px; margin-top: 2px; }
  .tag { background: #e8f0ff; color: #2563eb; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
  .main-grid { display: none; }
  .main-grid.show { display: flex; flex-wrap: wrap; gap: 16px; }
  @media (max-width: 620px) {
    .card, .main-grid .card { flex: 0 1 100%; }
  }
  h1 { font-size: 20px; margin-bottom: 16px; }
  h2 { font-size: 14px; color: #666; margin: 18px 0 8px; }
  label { display: block; font-size: 13px; color: #666; margin: 12px 0 4px; }
  input { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  input:focus { outline: none; border-color: #4a7cff; }
  button { margin-top: 12px; padding: 9px 18px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; background: #4a7cff; color: #fff; }
  button:hover { background: #3a66d8; }
  button:disabled { background: #a8bdf5; cursor: not-allowed; }
  .danger { background: #e05252; } .danger:hover { background: #c23f3f; }
  .msg { margin-top: 10px; font-size: 13px; line-height: 1.5; }
  .err { color: #d33; }
  .ok { color: #2a8a3f; }
  .debug { color: #b58900; font-family: monospace; }
  .info { font-size: 13px; color: #444; line-height: 1.8; }
  .link { font-size: 13px; margin-top: 14px; }
  .link a { color: #4a7cff; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="loginNeeded">
    <h1>需要登录</h1>
    <p style="font-size:14px; color:#666; margin-bottom:16px;">请先登录认证中心后再访问个人中心。</p>
    <button id="goLogin">去登录</button>
  </div>

  <div id="main" class="main-grid">
    <div class="card">
      <h1>个人中心</h1>
      <div class="info" id="userInfo"></div>
      <div class="link"><a href="/admin" id="adminLink" style="display:none;">管理后台</a></div>
      <div class="link"><a href="#" id="logout">退出登录</a></div>
    </div>

    <div class="card">
      <h2>修改用户名</h2>
      <label>新用户名</label>
      <input id="newUsername" maxlength="20">
      <button id="saveUsername">保存</button>
      <div class="msg" id="msgUsername"></div>
    </div>

    <div class="card">
      <h2>修改密码</h2>
      <label>旧密码</label>
      <input id="oldPassword" type="password">
      <label>新密码（至少 8 位）</label>
      <input id="newPassword" type="password">
      <button id="savePassword">保存</button>
      <div class="msg" id="msgPassword"></div>
    </div>

    <div class="card">
      <h2>修改邮箱</h2>
      <label>新邮箱</label>
      <input id="newEmail" type="email">
      <button id="sendEmailCode">发送验证码</button>
      <div id="emailCodeRow" style="display:none;">
        <label>新邮箱收到的验证码</label>
        <input id="emailCode" inputmode="numeric" maxlength="6" placeholder="6 位数字">
        <button id="confirmEmail">确认修改</button>
      </div>
      <div class="msg" id="msgEmail"></div>
    </div>

    <div class="card">
      <h2>TOTP 二次验证</h2>
      <div class="msg" id="msgTotp"></div>
      <div id="totpBound" style="display:none;">
        <p style="font-size:13px; color:#666; margin-bottom:8px;">已绑定：登录时需输入 TOTP 验证码。</p>
        <label>当前 TOTP 验证码（确认解绑）</label>
        <input id="totpDisableCode" inputmode="numeric" maxlength="6" placeholder="6 位数字">
        <br><button id="disableTotp" class="danger">解绑 TOTP</button>
      </div>
      <div id="totpUnbound">
        <p style="font-size:13px; color:#666; margin-bottom:8px;">用认证器 App（Google Authenticator / 微软 Authenticator）扫描二维码或手动输入密钥。</p>
        <button id="setupTotp">生成绑定密钥</button>
        <div id="totpSetupBox" style="display:none; margin-top:12px;">
          <img id="totpQr" alt="TOTP 二维码" style="width:180px; height:180px; border:1px solid #eee; border-radius:8px;">
          <p class="mono" id="totpSecret" style="font-size:12px; word-break:break-all; margin-top:8px;"></p>
          <label>认证器中的 6 位验证码</label>
          <input id="totpCode" inputmode="numeric" maxlength="6" placeholder="6 位数字">
          <br><button id="confirmTotp">确认绑定</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>登录设备</h2>
      <p style="font-size:13px; color:#666; margin-bottom:8px;" id="sessionHint"></p>
      <div id="sessionList"></div>
      <br><button id="revokeOthers" class="gray">退出其他设备</button>
      <div class="msg" id="msgSessions"></div>
    </div>

    <div class="card">
      <h2>已授权应用</h2>
      <p style="font-size:13px; color:#666; margin-bottom:8px;">这些站点通过认证中心登录过你的账号。</p>
      <div id="appList"></div>
    </div>
  </div>
</div>

<script src="/site.js"></script>
<script>
let user = null;

function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json' };
  return fetch(path, { ...options, headers }).then(async (r) => {
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) {
      showLoginNeeded();
    }
    return { status: r.status, data };
  });
}

function msg(id, text, cls) {
  const el = document.getElementById(id);
  if (el) { el.textContent = text; el.className = 'msg ' + (cls || 'err'); }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (m) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

async function init() {
  const { status, data } = await api('/api/userinfo');
  if (status !== 200) return showLoginNeeded();
  user = data;
  document.getElementById('main').classList.add('show');
  document.getElementById('loginNeeded').style.display = 'none';
  document.getElementById('userInfo').innerHTML =
    'ID：<b>' + escapeHtml(String(user.id)) + '</b><br>' +
    '用户名：<b>' + escapeHtml(user.username) + '</b><br>' +
    '邮箱：' + escapeHtml(user.email) + '<br>' +
    '角色：' + (user.role === 'admin' ? '管理员' : '普通用户');
  if (user.role === 'admin') document.getElementById('adminLink').style.display = 'inline';
  renderTotp();
  loadSessions();
  loadApps();
}

// 粗粒度识别设备：只区分操作系统与浏览器，不追求准确
function parseUA(ua) {
  if (!ua) return '未知设备';
  const os = /Windows/.test(ua) ? 'Windows'
    : /iPhone|iPad|iPod/.test(ua) ? 'iOS'
    : /Android/.test(ua) ? 'Android'
    : /Mac OS X|Macintosh/.test(ua) ? 'macOS'
    : /Linux/.test(ua) ? 'Linux' : '未知系统';
  const br = /Edg\//.test(ua) ? 'Edge'
    : /OPR\//.test(ua) ? 'Opera'
    : /Chrome\//.test(ua) ? 'Chrome'
    : /Firefox\//.test(ua) ? 'Firefox'
    : /Safari\//.test(ua) ? 'Safari' : '未知浏览器';
  return os + ' · ' + br;
}

function fmtTime(v) {
  if (!v) return '-';
  try { return new Date(v).toLocaleString(); } catch { return '-'; }
}

async function loadSessions() {
  const { status, data } = await api('/api/sessions');
  if (status !== 200) return;
  document.getElementById('sessionHint').textContent =
    '会话最长 ' + data.ttlDays + ' 天，闲置超过 ' + data.idleHours + ' 小时自动失效。';

  const el = document.getElementById('sessionList');
  if (!data.sessions.length) {
    el.innerHTML = '<div class="muted">无</div>';
    return;
  }
  el.innerHTML = data.sessions.map((s) =>
    '<div class="session-row"><b>' + parseUA(s.userAgent) + '</b>' +
    (s.current ? '<span class="tag">当前</span>' : '') +
    '<div class="muted">' + escapeHtml(s.ip || '未知 IP') +
    ' · 最后活跃 ' + fmtTime(s.lastSeen) + '</div></div>'
  ).join('');

  const btn = document.getElementById('revokeOthers');
  btn.disabled = data.sessions.length <= 1;
}

document.getElementById('revokeOthers').addEventListener('click', async () => {
  const btn = document.getElementById('revokeOthers');
  btn.disabled = true;
  const { status, data } = await api('/api/sessions/revoke-others', { method: 'POST' });
  msg('msgSessions', status === 200 ? ('已退出 ' + data.revoked + ' 台设备') : (data.error || '操作失败'),
      status === 200 ? 'ok' : 'err');
  loadSessions();
});

async function loadApps() {
  const { status, data } = await api('/api/authorizations');
  if (status !== 200) return;
  const el = document.getElementById('appList');
  if (!data.apps.length) {
    el.innerHTML = '<div class="muted">还没有应用使用过你的账号</div>';
    return;
  }
  el.innerHTML = data.apps.map((a) =>
    '<div class="session-row"><b>' + escapeHtml(a.clientName) + '</b>' +
    '<div class="muted">授权范围：' + escapeHtml(a.scope || 'openid') +
    ' · ' + fmtTime(a.authorizedAt) + '</div></div>'
  ).join('');
}

function showLoginNeeded() {
  document.getElementById('loginNeeded').style.display = 'block';
  document.getElementById('main').classList.remove('show');
}

document.getElementById('goLogin').addEventListener('click', () => {
  location.href = '/login?redirect=' + encodeURIComponent(location.pathname);
});

document.getElementById('logout').addEventListener('click', async (e) => {
  e.preventDefault();
  try { await fetch('/api/logout', { method: 'POST' }); } catch {}
  location.href = '/login';
});

init();

document.getElementById('saveUsername').addEventListener('click', async () => {
  const username = document.getElementById('newUsername').value.trim();
  if (!username) return msg('msgUsername', '请输入新用户名');
  const { status, data } = await api('/api/profile/username', { method: 'POST', body: JSON.stringify({ username }) });
  msg('msgUsername', status === 200 ? data.message || '已更新' : data.error, status === 200 ? 'ok' : 'err');
  if (status === 200) init();
});

document.getElementById('savePassword').addEventListener('click', async () => {
  const old_password = document.getElementById('oldPassword').value;
  const new_password = document.getElementById('newPassword').value;
  if (!old_password || !new_password) return msg('msgPassword', '请填写完整');
  const { status, data } = await api('/api/profile/password', { method: 'POST', body: JSON.stringify({ old_password, new_password }) });
  msg('msgPassword', status === 200 ? data.message || '已修改' : data.error, status === 200 ? 'ok' : 'err');
  if (status === 200) {
    document.getElementById('oldPassword').value = '';
    document.getElementById('newPassword').value = '';
    // 改密后该用户所有会话失效，1.5 秒后跳登录
    setTimeout(() => { location.href = '/login?redirect=' + encodeURIComponent('/profile'); }, 1500);
  }
});

document.getElementById('sendEmailCode').addEventListener('click', async () => {
  const new_email = document.getElementById('newEmail').value.trim();
  if (!new_email) return msg('msgEmail', '请输入新邮箱');
  const { status, data } = await api('/api/profile/email', { method: 'POST', body: JSON.stringify({ new_email }) });
  if (status !== 200) return msg('msgEmail', data.error, 'err');
  document.getElementById('emailCodeRow').style.display = 'block';
  let html = data.message;
  if (data.debug_code) html += '<br><span class="debug">[调试模式] 验证码：' + data.debug_code + '</span>';
  msg('msgEmail', html, 'ok');
});

document.getElementById('confirmEmail').addEventListener('click', async () => {
  const new_email = document.getElementById('newEmail').value.trim();
  const code = document.getElementById('emailCode').value.trim();
  if (!code) return;
  const { status, data } = await api('/api/profile/email/verify', { method: 'POST', body: JSON.stringify({ new_email, code }) });
  msg('msgEmail', status === 200 ? data.message || '已更新' : data.error, status === 200 ? 'ok' : 'err');
  if (status === 200) {
    // 改邮箱后所有会话失效，稍后跳登录
    setTimeout(() => { location.href = '/login?redirect=' + encodeURIComponent('/profile'); }, 1500);
  }
});

function renderTotp() {
  const bound = user && user.totp_enabled;
  document.getElementById('totpBound').style.display = bound ? 'block' : 'none';
  document.getElementById('totpUnbound').style.display = bound ? 'none' : 'block';
}

document.getElementById('setupTotp').addEventListener('click', async () => {
  const { status, data } = await api('/api/profile/totp-setup', { method: 'POST' });
  if (status !== 200) return msg('msgTotp', data.error || '生成失败', 'err');
  document.getElementById('totpSetupBox').style.display = 'block';
  document.getElementById('totpQr').src = data.qr;
  document.getElementById('totpSecret').textContent = '密钥：' + data.secret;
  msg('msgTotp', '请扫描二维码或在认证器中输入密钥', 'ok');
});

document.getElementById('confirmTotp').addEventListener('click', async () => {
  const code = document.getElementById('totpCode').value.trim();
  if (!code) return;
  const { status, data } = await api('/api/profile/totp-confirm', { method: 'POST', body: JSON.stringify({ code }) });
  if (status !== 200) return msg('msgTotp', data.error || '绑定失败', 'err');
  msg('msgTotp', 'TOTP 已绑定', 'ok');
  document.getElementById('totpSetupBox').style.display = 'none';
  await init();
  renderTotp();
});

document.getElementById('disableTotp').addEventListener('click', async () => {
  const code = document.getElementById('totpDisableCode').value.trim();
  if (!code) return msg('msgTotp', '请输入当前 TOTP 验证码', 'err');
  const { status, data } = await api('/api/profile/totp-disable', { method: 'POST', body: JSON.stringify({ code }) });
  if (status !== 200) return msg('msgTotp', data.error || '解绑失败', 'err');
  msg('msgTotp', 'TOTP 已解绑', 'ok');
  await init();
  renderTotp();
});

init();
</script>
</body>
</html>
