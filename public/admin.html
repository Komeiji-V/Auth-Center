<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f6f8; color: #222; }
  .wrap { max-width: 980px; margin: 40px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); padding: 20px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin-bottom: 12px; }
  label { font-size: 13px; color: #666; display: block; margin: 10px 0 4px; }
  input, select { padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  button { padding: 7px 14px; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; background: #4a7cff; color: #fff; margin: 3px; white-space: nowrap; }
  button:hover { background: #3a66d8; }
  button:disabled { background: #a8bdf5; cursor: not-allowed; }
  .danger { background: #e05252; } .danger:hover { background: #c23f3f; }
  .green { background: #2a8a3f; } .green:hover { background: #227234; }
  .gray { background: #888; } .gray:hover { background: #6f6f6f; }
  .orange { background: #d98324; } .orange:hover { background: #b86f1c; }
  .teal { background: linear-gradient(135deg, #0d9488, #14b8a6); } .teal:hover { filter: brightness(0.92); background: linear-gradient(135deg, #0d9488, #14b8a6); }
  .msg { margin: 10px 0; font-size: 13px; }
  .err { color: #d33; } .ok { color: #2a8a3f; }
  table { width: 100%; table-layout: fixed; min-width: 1300px; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid #eee; white-space: nowrap; vertical-align: middle; }
  th { color: #666; font-weight: 600; white-space: nowrap; }
  th:nth-child(1) { width: 52px; }
  th:nth-child(2) { width: 12%; }
  th:nth-child(3) { width: 20%; }
  th:nth-child(4) { width: 80px; }
  th:nth-child(5) { width: 22%; }
  th:nth-child(6) { width: 130px; }
  th:nth-child(7) { width: 26%; }
  th:nth-child(1) { width: 52px; }
  th:nth-child(2) { width: 15%; }
  th:nth-child(3) { width: 23%; }
  th:nth-child(4) { width: 90px; }
  th:nth-child(5) { width: 20%; }
  th:nth-child(6) { width: 148px; }
  .table-wrap { overflow-x: auto; margin-top: 10px; }
  .table-wrap::-webkit-scrollbar { height: 8px; }
  .table-wrap::-webkit-scrollbar-track { background: #eef0f5; border-radius: 4px; }
  .table-wrap::-webkit-scrollbar-thumb { background: #9aa3b8; border-radius: 4px; }
  .table-wrap::-webkit-scrollbar-thumb:hover { background: #7c86a0; }
  .filter-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .filter-bar select { margin: 0; }
  .filter-bar button { margin: 0; }
  .tabs { display: flex; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid #eee; }
  .tab { padding: 10px 18px; border-radius: 8px 8px 0 0; background: transparent; color: #555; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s ease; }
  .tab:hover { color: #4a7cff; }
  .tab.active { background: transparent; color: #4a7cff; font-weight: 600; border-bottom-color: #4a7cff; }
  .tabbed-card { padding: 0; overflow: hidden; }
  .tabbed-card .panel { padding: 16px 20px; }
  .invite-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 4px; }
  .invite-field { display: flex; flex-direction: column; flex: 1 1 130px; max-width: 180px; }
  .invite-field input { width: 100%; }
  .invite-field label { margin: 0 0 4px; }
  .invite-actions { display: flex; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  .invite-actions label { margin: 0; white-space: nowrap; }
  .invite-btns { display: flex; gap: 8px; margin-top: 8px; }
  .copy-btn { padding: 2px 8px; font-size: 12px; background: #e8ecf5; color: #3a5fc8; margin: 0 0 0 6px; border-radius: 6px; }
  .copy-btn:hover { background: #4a7cff; color: #fff; }
  .panel { display: none; } .panel.active { display: block; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .b-pending { background: #fff3cd; color: #8a6d1a; }
  .b-active { background: #d4edda; color: #1e6f34; }
  .b-banned { background: #f8d7da; color: #a13535; }
  .owner { background: #cfe2ff; color: #084298; }
  .admin { background: #d1e7ff; color: #0a58ca; }
  .apply { color: #666; font-size: 12px; }
  .mono { font-family: monospace; font-size: 12px; }
  .code-list { max-height: 300px; overflow-y: auto; }
  #loginCard { max-width: 420px; margin: 40px auto; }
  #app { display: none; }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid #eee;
  }
  .card-top-left {
    display: flex;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
  }
  .card-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 700;
    color: #333;
  }
  .logo-dot {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    background: linear-gradient(135deg, #4a7cff, #3a66d8);
    display: inline-block;
  }
  .tabs { display: flex; gap: 22px; }
  .tab {
    padding: 4px 2px;
    background: transparent;
    color: #555;
    cursor: pointer;
    font-size: 14px;
    border-bottom: 2px solid transparent;
    transition: color .15s ease;
  }
  .tab:hover { color: #4a7cff; }
  .tab.active { color: #4a7cff; font-weight: 600; border-bottom-color: #4a7cff; }
  .card-user { display: flex; align-items: center; gap: 12px; }
  .user-name { font-size: 14px; font-weight: 600; color: #333; }
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; width: 360px; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
  .modal h2 { font-size: 16px; margin-bottom: 14px; }
  .modal label { font-size: 13px; color: #666; display: block; margin: 10px 0 4px; }
  .modal input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  .modal .row { text-align: right; margin-top: 16px; }
  .modal .row button { margin: 0 4px; }
  .confirm-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 110; align-items: center; justify-content: center; }
  .confirm-mask.show { display: flex; }
  .confirm-modal { background: #fff; border-radius: 12px; padding: 24px; width: 360px; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
  .confirm-modal h2 { font-size: 16px; margin-bottom: 10px; }
  .confirm-modal p { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 18px; }
  .confirm-modal .row { text-align: right; }
  .confirm-modal .row button { margin: 0 4px; }
</style>
</head>
<body>

<div id="loginCard" class="card">
  <h1>管理后台登录</h1>
  <label>用户名 / 邮箱</label>
  <input id="account" style="width:100%;" autocomplete="username">
  <label>密码</label>
  <input id="password" type="password" style="width:100%;" autocomplete="current-password">
  <div id="totpRow">
    <label>TOTP 验证码（必填）</label>
    <input id="totp" inputmode="numeric" style="width:100%;" placeholder="6 位数字">
  </div>
  <br><button id="loginBtn" style="width:100%; margin-top:14px;">登录</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="app">
  <div class="card tabbed-card">
    <div class="card-top">
      <div class="card-top-left">
        <div class="card-title"><span class="logo-dot"></span>管理后台</div>
        <div class="tabs">
          <div class="tab active" data-panel="users">用户管理</div>
          <div class="tab" data-panel="invites">邀请码</div>
          <div class="tab" data-panel="settings">注册模式</div>
        </div>
      </div>
      <div class="card-user" id="userInfo"></div>
    </div>
    <div id="panel-users" class="panel active">
      <h2>用户列表</h2>
      <div class="filter-bar">
        <select id="statusFilter">
          <option value="all">全部</option>
          <option value="pending">待审核</option>
          <option value="active">已通过</option>
          <option value="banned">已封禁</option>
        </select>
        <button id="refreshUsers">刷新</button>
      </div>
      <div class="table-wrap">
      <table>
        <thead><tr>
          <th>ID</th><th>用户名</th><th>邮箱</th><th>状态</th><th>申请说明</th><th>注册时间</th><th>操作</th>
        </tr></thead>
        <tbody id="userRows"></tbody>
      </table>
      </div>
    </div>

    <div id="panel-invites" class="panel">
      <h2>生成邀请码</h2>
      <div class="invite-row">
        <div class="invite-field">
          <label>数量</label>
          <input id="inviteCount" type="number" value="1" min="1" max="100">
        </div>
        <div class="invite-field">
          <label>可用次数（0 = 不限）</label>
          <input id="inviteMaxUses" type="number" value="1" min="0">
        </div>
        <div class="invite-field">
          <label>有效天数（留空永久）</label>
          <input id="inviteDays" type="number" min="1" placeholder="永久">
        </div>
      </div>
      <div class="invite-actions">
        <label>备注（可选）</label>
        <input id="inviteNote" style="width:260px;" placeholder="发给谁/用途">
      </div>
      <div class="invite-btns">
        <button id="genInvites">生成</button>
        <button id="refreshInvites" class="gray">刷新列表</button>
      </div>
      <div class="code-list"><div class="table-wrap"><table>
        <thead><tr><th>邀请码</th><th>备注</th><th>使用状态</th><th>过期时间</th><th>创建时间</th></tr></thead>
        <tbody id="inviteRows"></tbody>
      </table></div></div>
    </div>

    <div id="panel-settings" class="panel">
      <h2>注册模式（三个独立开关，可任意组合，立即生效）</h2>
      <label><input type="checkbox" id="swInvite"> 邀请码注册：必须有有效邀请码才能注册</label>
      <label><input type="checkbox" id="swEmail"> 邮箱验证：注册需邮箱验证码（推荐开启，防机器人）</label>
      <label><input type="checkbox" id="swReview"> 人工审核：注册后需管理员通过才能登录</label>
      <br><button id="saveMode">保存模式</button>
      <div class="msg" id="modeMsg"></div>
    </div>
  </div>
</div>

<div class="modal-mask" id="editModal">
  <div class="modal">
    <h2>编辑用户</h2>
    <label>用户名</label>
    <input id="editUsername" maxlength="20">
    <label>邮箱</label>
    <input id="editEmail" type="email">
    <div class="row">
      <button class="gray" id="editCancel">取消</button>
      <button id="editSave">保存</button>
    </div>
    <div class="msg" id="editMsg"></div>
  </div>
</div>

<div class="confirm-mask" id="confirmModal">
  <div class="confirm-modal">
    <h2 id="cfTitle">确认操作</h2>
    <p id="cfMsg"></p>
    <div class="row">
      <button class="gray" id="cfCancel">取消</button>
      <button id="cfOk">确认</button>
    </div>
  </div>
</div>

<script src="/site.js"></script>
<script>
const q = new URLSearchParams(location.search);
let token = sessionStorage.getItem('admin_token') || '';
let refreshToken = sessionStorage.getItem('admin_refresh') || '';
let currentUser = null;
let refreshing = false;

function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(path, { ...options, headers }).then(async (r) => {
    const data = await r.json().catch(() => ({}));
    if (r.status === 401 && refreshToken) {
      const ok = await tryRefresh();
      if (ok) return api(path, options);
    }
    return { status: r.status, data };
  });
}

async function tryRefresh() {
  if (refreshing) return false;
  refreshing = true;
  try {
    const r = await fetch('/api/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refreshToken }),
    });
    const d = await r.json();
    if (r.ok && d.token) {
      token = d.token;
      refreshToken = d.refresh_token;
      sessionStorage.setItem('admin_token', token);
      sessionStorage.setItem('admin_refresh', refreshToken);
      return true;
    }
    sessionStorage.removeItem('admin_token');
    sessionStorage.removeItem('admin_refresh');
    token = '';
    refreshToken = '';
    return false;
  } catch {
    return false;
  } finally {
    refreshing = false;
  }
}

function msg(id, text, cls) {
  const el = document.getElementById(id);
  if (el) { el.textContent = text; el.className = 'msg ' + (cls || 'err'); }
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const body = { account: document.getElementById('account').value.trim(), password: document.getElementById('password').value };
  const t = document.getElementById('totp').value.trim();
  if (t) body.totp_code = t;
  const { status, data } = await api('/api/login', { method: 'POST', body: JSON.stringify(body) });
  if (status !== 200) {
    return msg('loginMsg', data.error || '登录失败');
  }
  if (data.user.role !== 'admin') return msg('loginMsg', '该账号不是管理员');
  token = data.token;
  refreshToken = data.refresh_token;
  currentUser = data.user;
  sessionStorage.setItem('admin_token', token);
  sessionStorage.setItem('admin_refresh', refreshToken);
  localStorage.setItem('auth_access_token', token);
  if (data.need_totp_setup) {
    location.href = '/totp?redirect=' + encodeURIComponent(location.origin + '/admin');
    return;
  }
  enterApp();
});

function enterApp() {
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('userInfo').innerHTML =
    '<span class="user-name">' + (currentUser ? currentUser.username : '') + '</span>' +
    '<a href="/profile" style="color:#4a7cff; font-size:13px;">个人中心</a>' +
    '<button class="gray" onclick="logout()">退出</button>';
  // 非 owner：隐藏邀请码和注册模式（仅 owner 可修改）
  if (currentUser && !currentUser.is_owner) {
    document.querySelectorAll('.tab').forEach((t) => {
      if (t.dataset.panel === 'invites' || t.dataset.panel === 'settings') {
        t.style.display = 'none';
      }
    });
  }
  loadUsers();
  loadMode();
  loadInvites();
}

function logout() {
  sessionStorage.removeItem('admin_token');
  sessionStorage.removeItem('admin_refresh');
  localStorage.removeItem('auth_access_token');
  localStorage.removeItem('auth_refresh_token');
  location.href = '/login';
}

// ---------- 用户管理 ----------
let currentUserList = [];

async function loadUsers() {
  const status = document.getElementById('statusFilter').value;
  const { status: s, data } = await api('/api/admin/users?status=' + status);
  if (s !== 200) return;
  currentUserList = data.users;
  const tbody = document.getElementById('userRows');
  tbody.innerHTML = '';
  const badges = { pending: 'b-pending', active: 'b-active', banned: 'b-banned' };
  const isOwner = !!(currentUser && currentUser.is_owner);
  for (const u of data.users) {
    const tr = document.createElement('tr');
    const ownerBadge = u.is_owner ? ' <span class="badge owner">owner</span>' : '';
    const adminBadge = u.role === 'admin' ? ' <span class="badge admin">admin</span>' : '';
    const canManagePrivileged = isOwner || !(u.role === 'admin' || u.is_owner);
    const ops = [];
    const uname = escapeHtml(u.username);
    const uemail = escapeHtml(u.email);
    const uapply = escapeHtml(u.apply_info || '');
    if (u.status === 'pending') {
      ops.push('<button class="green" onclick="doAction(' + u.id + ',\'approve\')">通过</button>');
      ops.push('<button class="danger" onclick="doAction(' + u.id + ',\'reject\',null,\'' + uname + '\')">拒绝</button>');
    }
    if (u.status === 'active' && canManagePrivileged) {
      ops.push('<button class="danger" onclick="doAction(' + u.id + ',\'ban\',null,\'' + uname + '\')">封禁</button>');
    }
    if (u.status === 'banned' && canManagePrivileged) {
      ops.push('<button class="green" onclick="doAction(' + u.id + ',\'unban\')">解封</button>');
    }
    if (u.status !== 'pending' && canManagePrivileged) {
      ops.push('<button class="orange" onclick="doAction(' + u.id + ',\'unlock\',null,\'' + uname + '\')">解锁</button>');
    }
    if (u.status === 'active' && canManagePrivileged) {
      ops.push('<button class="teal" onclick="doAction(' + u.id + ',\'reset-totp\',null,\'' + uname + '\')">重置 TOTP</button>');
    }
    if (u.status === 'active' && !u.is_owner && isOwner) {
      ops.push('<button class="' + (u.role === 'admin' ? 'orange' : 'green') + '" onclick="doAction(' + u.id + ',\'set-admin\',{\'is_admin\':' + (u.role !== 'admin') + '},\'' + uname + '\')">' +
        (u.role === 'admin' ? '取消管理员' : '设为管理员') + '</button>');
    }
    if (u.status === 'active' && canManagePrivileged) {
      ops.push('<button class="gray" onclick="editUser(' + u.id + ')">编辑</button>');
    }
    if (ops.length === 0) ops.push('<span style="color:#bbb;">—</span>');
    tr.innerHTML =
      '<td>' + u.id + '</td>' +
      '<td>' + uname + ownerBadge + adminBadge + '</td>' +
      '<td>' + uemail + '</td>' +
      '<td><span class="badge ' + (badges[u.status] || '') + '">' + u.status + '</span></td>' +
      '<td class="apply">' + uapply + '</td>' +
      '<td class="mono">' + (u.created_at || '').slice(0, 19).replace('T', ' ') + '</td>' +
      '<td>' + ops.join('') + '</td>';
    tbody.appendChild(tr);
  }
}

// ---------- XSS 转义 ----------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (m) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

// ---------- 通用确认弹窗 ----------
let confirmCb = null;

function showConfirm(opts) {
  document.getElementById('cfTitle').textContent = opts.title || '确认操作';
  document.getElementById('cfMsg').innerHTML = opts.message || '';
  const ok = document.getElementById('cfOk');
  ok.textContent = opts.confirmText || '确认';
  ok.className = opts.danger ? 'danger' : '';
  confirmCb = opts.onConfirm || null;
  document.getElementById('confirmModal').classList.add('show');
}

function hideConfirm() {
  document.getElementById('confirmModal').classList.remove('show');
  confirmCb = null;
}

document.getElementById('cfOk').addEventListener('click', () => {
  const cb = confirmCb;
  hideConfirm();
  if (cb) cb();
});

document.getElementById('cfCancel').addEventListener('click', hideConfirm);

async function doAction(id, action, extra, username) {
  const run = async () => {
    const body = extra ? JSON.stringify(extra) : '{}';
    const { status, data } = await api('/api/admin/users/' + id + '/' + action, { method: 'POST', body });
    if (status !== 200) return alert(data.error || '操作失败');
    loadUsers();
  };
    const name = escapeHtml(username || '');
    switch (action) {
      case 'ban':
        showConfirm({ title: '封禁用户', message: '确认封禁 <b>' + name + '</b>？', confirmText: '封禁', danger: true, onConfirm: run });
        break;
      case 'reject':
        showConfirm({ title: '拒绝申请', message: '确认拒绝 <b>' + name + '</b> 的申请？将删除其注册记录，用户可重新注册。', confirmText: '拒绝', danger: true, onConfirm: run });
        break;
      case 'unlock':
        showConfirm({ title: '解锁账号', message: '确认清除 <b>' + name + '</b> 的登录锁定？', confirmText: '解锁', onConfirm: run });
        break;
      case 'reset-totp':
        showConfirm({ title: '重置 TOTP', message: '确认重置 <b>' + name + '</b> 的 TOTP？用户需重新绑定。', confirmText: '重置', onConfirm: run });
        break;
      case 'set-admin':
        if (extra && extra.is_admin) {
          showConfirm({ title: '设为管理员', message: '确认将 <b>' + name + '</b> 设为管理员？', confirmText: '设为管理员', onConfirm: run });
        } else {
          showConfirm({ title: '取消管理员', message: '确认取消 <b>' + name + '</b> 的管理员身份？', confirmText: '取消', danger: true, onConfirm: run });
        }
        break;
      default:
        run();
    }
}

// ---------- 编辑用户（模态框）----------
let editingUserId = null;

function editUser(id) {
  const u = currentUserList.find((x) => x.id === id);
  if (!u) return;
  editingUserId = id;
  document.getElementById('editUsername').value = u.username;
  document.getElementById('editEmail').value = u.email;
  const m = document.getElementById('editMsg');
  m.textContent = '';
  m.className = 'msg';
  document.getElementById('editModal').classList.add('show');
}

document.getElementById('editSave').addEventListener('click', async () => {
  const username = document.getElementById('editUsername').value.trim();
  const email = document.getElementById('editEmail').value.trim();
  const { status, data } = await api('/api/admin/users/' + editingUserId + '/edit', {
    method: 'POST',
    body: JSON.stringify({ username, email }),
  });
  if (status !== 200) {
    const m = document.getElementById('editMsg');
    m.textContent = data.error || '编辑失败';
    m.className = 'msg err';
    return;
  }
  document.getElementById('editModal').classList.remove('show');
  loadUsers();
});

document.getElementById('editCancel').addEventListener('click', () => {
  document.getElementById('editModal').classList.remove('show');
});

document.getElementById('statusFilter').addEventListener('change', loadUsers);
document.getElementById('refreshUsers').addEventListener('click', loadUsers);

// ---------- 邀请码 ----------
document.getElementById('genInvites').addEventListener('click', async () => {
  const count = parseInt(document.getElementById('inviteCount').value, 10) || 1;
  const maxUses = parseInt(document.getElementById('inviteMaxUses').value, 10);
  const expiresDays = parseInt(document.getElementById('inviteDays').value, 10);
  const note = document.getElementById('inviteNote').value.trim();
  const body = { count, note };
  if (Number.isInteger(maxUses) && maxUses >= 0) body.max_uses = maxUses;
  if (Number.isInteger(expiresDays) && expiresDays > 0) body.expires_days = expiresDays;
  const { status, data } = await api('/api/admin/invite-codes', { method: 'POST', body: JSON.stringify(body) });
  if (status !== 200) return alert(data.error || '生成失败');
  alert('已生成 ' + data.codes.length + ' 个邀请码：\n' + data.codes.join('\n'));
  loadInvites();
});

async function loadInvites() {
  const { status, data } = await api('/api/admin/invite-codes');
  if (status !== 200) return;
  const tbody = document.getElementById('inviteRows');
  tbody.innerHTML = '';
  for (const c of data.codes) {
    const tr = document.createElement('tr');
    const unlimited = c.max_uses === 0;
    const usedText = (unlimited ? '已用 ' + c.used_count + ' 次（不限）' : c.used_count + ' / ' + c.max_uses + ' 次');
    const expired = c.expires_at && new Date(c.expires_at) < new Date();
    let statusHtml;
    if (expired) statusHtml = '<span class="badge b-banned">已过期</span>';
    else if (!unlimited && c.used_count >= c.max_uses) statusHtml = '<span class="badge b-banned">已用尽</span>';
    else statusHtml = '<span class="badge b-pending">可用（' + usedText + '）</span>';
    tr.innerHTML = '<td class="mono">' + c.code + '<button class="copy-btn" onclick="copyInvite(\'' + c.code + '\', this)">复制</button></td><td>' + (c.note || '') + '</td><td>' + statusHtml +
      (c.used_by ? '（' + c.used_by + '）' : '') +
      '</td><td class="mono">' + (c.expires_at ? (c.expires_at.slice(0, 19).replace('T', ' ')) : '永久') +
      '</td><td class="mono">' + (c.created_at || '').slice(0, 19).replace('T', ' ') + '</td>';
    tbody.appendChild(tr);
  }
}

function copyInvite(code, btn) {
  navigator.clipboard.writeText(code).then(() => {
    const old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = old; }, 1500);
  }).catch(() => {
    btn.textContent = '复制失败';
    setTimeout(() => { btn.textContent = '复制'; }, 1500);
  });
}

document.getElementById('refreshInvites').addEventListener('click', loadInvites);

// ---------- 模式开关 ----------
async function loadMode() {
  const { data } = await api('/api/config');
  const f = data.flags || {};
  document.getElementById('swInvite').checked = !!f.invite_required;
  document.getElementById('swEmail').checked = f.email_verify_required !== false;
  document.getElementById('swReview').checked = !!f.review_required;
}

document.getElementById('saveMode').addEventListener('click', async () => {
  const body = JSON.stringify({
    invite_required: document.getElementById('swInvite').checked,
    email_verify_required: document.getElementById('swEmail').checked,
    review_required: document.getElementById('swReview').checked,
  });
  const { status, data } = await api('/api/admin/config', { method: 'POST', body });
  msg('modeMsg', status === 200 ? '已保存' : data.error, status === 200 ? 'ok' : 'err');
});

// ---------- Tab 切换 ----------
document.querySelectorAll('.tab').forEach((tab) => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
  });
});

// ---------- 初始化：兼容登录页存储的 token（避免重输密码）----------
async function initFromStorage() {
  let t = sessionStorage.getItem('admin_token') || localStorage.getItem('auth_access_token') || '';
  if (!t) return;
  token = t;
  const r = await fetch('/api/userinfo', { headers: { Authorization: 'Bearer ' + token } });
  const d = await r.json().catch(() => ({}));
  if (r.ok && d.role === 'admin') {
    currentUser = d;
    if (q.get('setup') === '1') {
      location.replace('/totp?redirect=' + encodeURIComponent(location.origin + '/admin'));
      return;
    }
    if (!d.totp_enabled) {
      location.replace('/totp?redirect=' + encodeURIComponent(location.origin + '/admin'));
      return;
    }
    enterApp();
  } else {
    localStorage.removeItem('auth_access_token');
    token = '';
  }
}

initFromStorage();
</script>
