<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f6f8; color: #222; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); padding: 32px; width: 340px; }
  h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
  label { display: block; font-size: 13px; color: #666; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  input:focus { outline: none; border-color: #4a7cff; }
  button { width: 100%; margin-top: 18px; padding: 11px; background: #4a7cff; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
  button:hover { background: #3a66d8; }
  button:disabled { background: #a8bdf5; cursor: not-allowed; }
  .msg { margin-top: 14px; font-size: 13px; line-height: 1.5; }
  .err { color: #d33; }
  .ok { color: #2a8a3f; }
  .debug { color: #b58900; font-family: monospace; }
  .link { margin-top: 14px; font-size: 13px; text-align: center; }
  .link a { color: #4a7cff; text-decoration: none; }
  #codeStep { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>注册账号</h1>
  <form id="form">
    <label for="username">用户名</label>
    <input id="username" maxlength="20" autocomplete="username" required>
    <label for="email">邮箱</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">密码（至少 8 位）</label>
    <input id="password" type="password" autocomplete="new-password" required>
    <label for="password2">确认密码</label>
    <input id="password2" type="password" autocomplete="new-password" required>
    <div id="inviteRow" style="display:none;">
      <label for="invite">邀请码</label>
      <input id="invite" autocomplete="off">
    </div>
    <div id="applyRow" style="display:none;">
      <label for="apply">申请说明（管理员审核依据）</label>
      <textarea id="apply" rows="3" maxlength="500" style="width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:14px; resize:vertical;"></textarea>
    </div>
    <button id="btn" type="submit">下一步：获取验证码</button>
  </form>
  <div id="codeStep" style="display:none;">
    <label for="code">邮箱验证码</label>
    <input id="code" inputmode="numeric" maxlength="6" placeholder="6 位数字">
    <button id="btnCode" type="button">验证</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="link">已有账号？<a id="loginLink" href="/login">去登录</a></div>
</div>

<script>
const q = new URLSearchParams(location.search);
const redirect = q.get('redirect') || '';
let submittedEmail = '';
let needVerify = true;

document.getElementById('loginLink').href = '/login' + (redirect ? '?redirect=' + encodeURIComponent(redirect) : '');

async function showMsg(html, cls) {
  const m = document.getElementById('msg');
  m.innerHTML = html;
  m.className = 'msg ' + (cls || 'err');
}

(async () => {
  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    const flags = cfg.flags || {};
    if (flags.invite_required) document.getElementById('inviteRow').style.display = 'block';
    if (flags.review_required) document.getElementById('applyRow').style.display = 'block';
    if (!flags.email_verify_required) {
      document.getElementById('btn').textContent = '提交注册';
    }
  } catch (e) {}
})();

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const p1 = document.getElementById('password').value;
  const p2 = document.getElementById('password2').value;
  if (p1 !== p2) return showMsg('两次输入的密码不一致');
  const btn = document.getElementById('btn');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username, email, password: p1,
        invite_code: document.getElementById('invite').value.trim() || undefined,
        apply_info: document.getElementById('apply').value.trim() || undefined,
      }),
    });
    const data = await resp.json();
    if (!resp.ok) return showMsg(data.error || '注册失败');
    needVerify = !!data.needs_verify;
    if (needVerify) {
      submittedEmail = email;
      document.getElementById('form').style.display = 'none';
      document.getElementById('codeStep').style.display = 'block';
      let html = '验证码已发送到 <b>' + email + '</b>，10 分钟内有效。';
      if (data.debug_code) html += '<br><span class="debug">[调试模式] 验证码：' + data.debug_code + '</span>';
      return showMsg(html, 'ok');
    }
    if (data.status === 'active') {
      const target = redirect ? '/login?redirect=' + encodeURIComponent(redirect) : '/login';
      showMsg(data.message + '，<a href="' + target + '">立即登录</a>', 'ok');
    } else {
      showMsg(data.message + '，管理员通过后会收到通知。', 'ok');
    }
  } catch (err) {
    showMsg('网络错误：' + err.message);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('btnCode').addEventListener('click', async () => {
  const code = document.getElementById('code').value.trim();
  if (!code) return;
  const btn = document.getElementById('btnCode');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/verify-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: submittedEmail, code }),
    });
    const data = await resp.json();
    if (!resp.ok) return showMsg(data.error || '验证失败');
    if (data.status === 'active') {
      const target = redirect ? '/login?redirect=' + encodeURIComponent(redirect) : '/login';
      showMsg(data.message + '，<a href="' + target + '">立即登录</a>', 'ok');
    } else {
      showMsg(data.message + '，管理员通过后会收到通知。', 'ok');
    }
  } catch (err) {
    showMsg('网络错误：' + err.message);
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
